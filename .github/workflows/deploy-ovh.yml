name: Deploy OVH

on:
  push:
    branches: [main, claude/jolly-carson-e4z4xi] # TEMP: test du déploiement
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hébergement mutualisé OVH Perso : pas de SSH/SFTP, uniquement FTP(S).
      # Secrets requis (Settings > Secrets and variables > Actions) :
      #   FTP_SERVER   ex. ftp.cluster0XX.hosting.ovh.net
      #   FTP_USERNAME identifiant FTP OVH
      #   FTP_PASSWORD mot de passe FTP OVH
      # Variables optionnelles :
      #   FTP_PROTOCOL   ftp (défaut ; OVH Perso ne gère pas le FTPS)
      #   FTP_SERVER_DIR dossier distant, défaut ./www/
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          port: 21
          server-dir: ${{ vars.FTP_SERVER_DIR || './www/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.DS_Store
            README*
            CLAUDE.md
